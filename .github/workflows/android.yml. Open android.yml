name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web folder
        run: |
          mkdir -p www/icons
          cp index.html manifest.webmanifest sw.js www/
          cp icon-192.png icon-512.png www/icons/
      - run: npm install
      - run: npx cap add android
      - name: App icon
        run: |
          pip install pillow || true
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            python3 -c "from PIL import Image;im=Image.open('icon-1024.png').resize(($s,$s));im.save('android/app/src/main/res/mipmap-$n/ic_launcher.png');im.save('android/app/src/main/res/mipmap-$n/ic_launcher_round.png')" || true
          done
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: reactor-shift-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
