name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web folder and icons
        run: |
          ls -la
          mkdir -p www/icons
          cp index.html manifest.webmanifest sw.js www/
          pip install pillow
          python3 - <<'PY'
          import os
          from PIL import Image
          src=None
          for n in ('icon-1024.png','icon-512.png','icon-192.png'):
              if os.path.exists(n):
                  src=Image.open(n).convert('RGB'); break
          if src is None:
              src=Image.new('RGB',(512,512),(16,24,26))
          src.resize((192,192)).save('www/icons/icon-192.png')
          src.resize((512,512)).save('www/icons/icon-512.png')
          src.resize((1024,1024)).save('icon-1024.png')
          PY
      - name: Use the fixed signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; else echo "No debug.keystore in repo; updates will need an uninstall first"; fi
      - run: npm install
      - run: npx cap add android
      - name: App icon
        run: |
          python3 - <<'PY'
          from PIL import Image
          import os
          im=Image.open('icon-1024.png').convert('RGBA')
          res='android/app/src/main/res/'
          # legacy square and round icons
          for n,s in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              r=im.resize((s,s),Image.NEAREST)
              r.save(res+'mipmap-%s/ic_launcher.png'%n)
              r.save(res+'mipmap-%s/ic_launcher_round.png'%n)
          # adaptive icon (Android 8+): foreground sits in the safe zone on a dark background
          for n,s in {'mdpi':108,'hdpi':162,'xhdpi':216,'xxhdpi':324,'xxxhdpi':432}.items():
              canvas=Image.new('RGBA',(s,s),(0,0,0,0))
              inner=int(s*0.64)
              canvas.paste(im.resize((inner,inner),Image.NEAREST),((s-inner)//2,(s-inner)//2))
              canvas.save(res+'mipmap-%s/ic_launcher_foreground.png'%n)
          open(res+'values/ic_launcher_background.xml','w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#10181A</color>\n</resources>\n')
          print(sorted(os.listdir(res)))
          PY
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: reactor-shift-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish a downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ReactorShift.apk
          gh release create "build-${{ github.run_number }}" ReactorShift.apk \
            --title "Reactor Shift build ${{ github.run_number }}" \
            --notes "Android APK. Download ReactorShift.apk below and open it on your phone. See the README for install help and the Play Protect warning." \
            --latest
            
