name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web folder and icons
        run: |
          ls -la
          mkdir -p www/icons
          cp index.html manifest.webmanifest sw.js www/
          pip install pillow
          python3 - <<'PY'
          import os
          from PIL import Image
          src=None
          for n in ('icon-1024.png','icon-512.png','icon-192.png'):
              if os.path.exists(n):
                  src=Image.open(n).convert('RGB'); break
          if src is None:
              src=Image.new('RGB',(512,512),(16,24,26))
          src.resize((192,192)).save('www/icons/icon-192.png')
          src.resize((512,512)).save('www/icons/icon-512.png')
          src.resize((1024,1024)).save('icon-1024.png')
          PY
      - run: npm install
      - run: npx cap add android
      - name: App icon
        run: |
          python3 - <<'PY'
          from PIL import Image
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          im=Image.open('icon-1024.png')
          for n,s in sizes.items():
              r=im.resize((s,s))
              r.save('android/app/src/main/res/mipmap-%s/ic_launcher.png'%n)
              r.save('android/app/src/main/res/mipmap-%s/ic_launcher_round.png'%n)
          PY
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: reactor-shift-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
